<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080c0b" />
  <meta name="description" content="Twenty Nine Eleven. Security and bespoke technology. Penetration testing, networks, access control and cameras." />
  <meta property="og:title" content="Twenty Nine Eleven — Security & bespoke technology" />
  <meta property="og:description" content="Security, networks, access control, cameras and bespoke technology. Start a conversation." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="/mark.svg" />
  <title>Twenty Nine Eleven — Security & bespoke technology</title>
</head>
<body>
  <main class="scene" aria-labelledby="company-name">
    <div class="stage">
      <div class="cipher-object">
        <div class="cipher-light" aria-hidden="true"></div>
        <div class="cipher-plane" aria-hidden="true"><svg id="cipher" viewBox="0 0 320 320" fill="none"></svg></div>
        <button class="motion-toggle" type="button" aria-label="Pause animation" aria-pressed="false" title="Pause animation" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path id="motion-icon" d="M7 5v10M13 5v10" /></svg>
        </button>
      </div>
      <h1 id="company-name" aria-label="Twenty Nine Eleven">
        <span class="name-mask"><span class="name-line">TWENTY NINE</span></span>
        <span class="name-mask"><span class="name-line name-second">ELEVEN</span></span>
      </h1>
      <p class="work-type" data-enter>Security <span>&</span> bespoke technology</p>
      <ul class="services" aria-label="Our work" data-enter>
        <li><span class="service-full">Penetration testing</span><span class="service-short">Pentesting</span></li>
        <li>Networks</li>
        <li><span class="service-full">Access control</span><span class="service-short">Access</span></li>
        <li>Cameras</li>
      </ul>
      <div class="contact-trigger-shell" data-enter>
        <button id="open-contact" class="contact-trigger" type="button" aria-haspopup="dialog" aria-controls="contact-dialog" disabled>
          <span>Start a conversation</span>
          <svg class="contact-arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5" /></svg>
          <span class="contact-rule" aria-hidden="true"></span>
        </button>
      </div>
      <noscript><p class="no-script">Enable JavaScript to open contact.</p></noscript>
    </div>
  </main>
  <div class="veil" aria-hidden="true"></div>
  <dialog id="contact-dialog" class="contact-dialog" aria-labelledby="contact-title">
    <div class="dialog-surface">
      <button id="close-contact" class="dialog-close" type="button" aria-label="Close contact"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg></button>
      <div class="dialog-content">
        <div class="contact-heading dialog-item">
          <span class="modal-kicker">TWENTY NINE ELEVEN</span>
          <h2 id="contact-title">What are you<br />working on?</h2>
          <p class="email-address">contact@twentynineeleven.net</p>
        </div>
        <form id="contact-form" method="post" action="https://contact.twentynineeleven.net/api/contact" novalidate>
          <fieldset id="contact-fields">
            <div class="field dialog-item">
              <label for="name">Your name</label>
              <input id="name" name="name" type="text" autocomplete="name" required maxlength="120" aria-describedby="name-error" />
              <span class="field-error" id="name-error"></span>
            </div>
            <div class="field dialog-item">
              <label for="email">Email address</label>
              <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="254" aria-describedby="email-error" />
              <span class="field-error" id="email-error"></span>
            </div>
            <div class="field dialog-item">
              <label for="message">Message</label>
              <textarea id="message" name="message" required minlength="10" maxlength="5000" rows="3" aria-describedby="message-error"></textarea>
              <span class="field-error" id="message-error"></span>
            </div>
            <div class="honeypot" aria-hidden="true" inert><label for="website">Leave this field empty</label><input id="website" name="website" autocomplete="off" tabindex="-1" /></div>
            <button class="send-button dialog-item" type="submit" disabled><span class="button-label">Send message</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7" /></svg></button>
          </fieldset>
          <p class="form-status" id="form-status" role="status" aria-live="polite" aria-atomic="true"></p>
        </form>
        <div class="success" id="success" hidden tabindex="-1">
          <svg class="success-mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 45 15v18L24 45 3 33V15Z"/><path class="success-check" d="m14 24 7 7 13-14" /></svg>
          <h3>Message received.</h3>
          <p>Thank you. Your enquiry is with us.</p>
          <button id="send-another" class="text-button" type="button">Send another message <span aria-hidden="true">↗</span></button>
        </div>
      </div>
    </div>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
