name: Publish GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'DEPLOY.md', 'worker/README.md', '.github/workflows/contact.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run contact:check
      - run: npm run build
        env:
          VITE_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT || 'https://contact.twentynineeleven.net/api/contact' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
